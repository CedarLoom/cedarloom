name: Preview

# Builds the site of a pull request from this repository with the base URL of its preview, publishes it to
# pr-preview/pr-<number>/ on the gh-pages branch with one sticky comment that links it, and removes the preview when the
# pull request closes. Pull requests from forks get no preview: their token cannot write. The paths match pages.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'site/**'
      - 'brand/**'
      - 'plugins/*/skills/*/SKILL.md'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/preview.yml'

permissions: {}

# The removal on close is never cancelled; a new push cancels the deploy of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    if: github.repository == 'CedarLoom/cedarloom' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: site
    steps:
      # The preview action pushes to gh-pages from this checkout with its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event.action != 'closed'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # No install scripts: the site needs none.
      - if: github.event.action != 'closed'
        name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: github.event.action != 'closed'
        name: Build
        env:
          BASE_URL: /cedarloom/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: npm run build
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site/build
