name: Preview

# Builds the site of a pull request from this repository with the base URL of its preview and publishes it to
# pr-preview/pr-<number>/ on the gh-pages branch, then links it with a QR code in a block at the bottom of the pull request
# description; preview-cleanup.yml removes it when the pull request closes. The build runs with a read-only token; the
# publish job, the only one that can write contents, runs no code from the pull request. The describe job, whose token
# can only edit pull requests, runs the block script of the base branch. Pull requests from forks get no preview: their
# token cannot write. The paths match pages.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'site/**'
      - 'brand/**'
      - 'plugins/*/skills/*/SKILL.md'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/preview.yml'

permissions: {}

# Shared with preview-cleanup.yml, so a removal waits for a running deploy.
concurrency:
  group: Preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'CedarLoom/cedarloom' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # No install scripts: the site needs none.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        env:
          BASE_URL: /cedarloom/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    if: github.repository == 'CedarLoom/cedarloom' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      url: ${{ steps.deploy.outputs.preview-url }}
      built: ${{ steps.deploy.outputs.action-start-time }}
    steps:
      # The preview action pushes to gh-pages from this checkout with its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/build
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        id: deploy
        with:
          action: deploy
          source-dir: site/build
          comment: false

  describe:
    if: github.repository == 'CedarLoom/cedarloom' && github.event.pull_request.head.repo.full_name == github.repository
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shared by the jobs that write the pull request description, so their read-write cycles never overlap.
    concurrency:
      group: PR-description-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch's script: no code from the pull request runs with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # The QR code service and its parameters are the preview action's defaults for its comment.
      - name: Link the preview in the pull request description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.preview.outputs.url }}
          BUILT: ${{ needs.preview.outputs.built }}
        run: |
          printf '<img src="https://qr.rossjrw.com/?color.dark=0d1117&url=%s" height="100" align="right" alt="QR code for preview link">\n\n**Site preview:** %s\n\nBuilt at %s; ready when the [GitHub Pages deployment](%s/%s/deployments) finishes.\n' \
            "$URL" "$URL" "$BUILT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/preview.md"
          node .github/scripts/pr-description-block.mjs "$GITHUB_REPOSITORY" "$PR" preview "$RUNNER_TEMP/preview.md"
