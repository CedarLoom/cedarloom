name: Pages

# Builds the site in site/ on pull requests and, from main, publishes it to the root of the gh-pages branch, which
# GitHub Pages serves. The deploy keeps pr-preview/, the previews of .github/workflows/preview.yml, and rebases instead
# of force-pushing so a preview pushed at the same time survives. The Skills page reads the skill front matter through
# .github/scripts, so those files are in the paths too.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'REUSE.toml'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'REUSE.toml'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# A deploy on main is never cancelled by the next push; it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.repository == 'CedarLoom/cedarloom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # No install scripts: the site needs none.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      # onBrokenLinks, onBrokenAnchors and onBrokenMarkdownLinks are `throw`: a broken link fails the build.
      - name: Build
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'CedarLoom/cedarloom' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The deploy action pushes to gh-pages from this checkout with its own token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/build
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site/build
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
