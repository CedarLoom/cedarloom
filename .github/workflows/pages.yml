name: Pages

# Builds the site in site/ on pull requests and deploys it to GitHub Pages from main. The Skills page reads the skill
# front matter through .github/scripts, so those files are in the paths too.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'REUSE.toml'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'REUSE.toml'
      - '.github/scripts/skills-doc.mjs'
      - '.github/scripts/skill-lint.mjs'
      - '.github/scripts/main.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# A deploy on main is never cancelled by the next push; it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.repository == 'CedarLoom/cedarloom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # No install scripts: the site needs none.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      # onBrokenLinks, onBrokenAnchors and onBrokenMarkdownLinks are `throw`: a broken link fails the build.
      - name: Build
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    if: github.repository == 'CedarLoom/cedarloom' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
