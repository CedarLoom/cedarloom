name: Preview cleanup

# Removes the preview of preview.yml from pr-preview/pr-<number>/ on the gh-pages branch when a pull request from this
# repository closes. No paths filter: the final diff of a pull request that had a preview may no longer touch the site.
# The preview block in the description becomes one line saying the preview was removed. A pull request
# without a preview gets no removal and no block. Runs no code from the pull request: the block script comes from the
# default branch.
on:
  pull_request:
    types: [closed]

permissions: {}

# Shared with preview.yml; never cancelled, so a removal waits for a running deploy.
concurrency:
  group: Preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remove:
    if: github.repository == 'CedarLoom/cedarloom' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared by the jobs that write the pull request description, so their read-write cycles never overlap.
    concurrency:
      group: PR-description-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 200: the preview exists; 404: no preview or no gh-pages branch yet.
      - name: Find the preview
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/pr-preview/pr-${PR_NUMBER}?ref=gh-pages")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GitHub API returned HTTP ${status}"; exit 1 ;;
          esac
      # A rerun after a failed description write finds no preview but still the block to mark removed.
      - name: Find the preview block
        id: block
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -q '^<!-- preview -->'; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      # The preview action pushes to gh-pages from this checkout with its own token.
      - if: steps.find.outputs.exists == 'true' || steps.block.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: steps.find.outputs.exists == 'true'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: remove
          comment: false
      - if: steps.find.outputs.exists == 'true' || steps.block.outputs.exists == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Mark the preview removed in the pull request description
        if: steps.find.outputs.exists == 'true' || steps.block.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf 'Preview removed: the pull request was closed.\n' > "$RUNNER_TEMP/preview.md"
          node .github/scripts/pr-description-block.mjs "$GITHUB_REPOSITORY" "$PR" preview "$RUNNER_TEMP/preview.md"
