schema_version: "1.1"
name: skill-setup-fresh-plan
description: 'On a repository without agent setup, with terminal questions off, setup writes nothing and its plan lists AGENTS.md with the CedarLoom block, CLAUDE.md, the coordinator policy file and each missing label (labels only where cl-orchestration is installed: CedarLoom/cedarloom#72). Needs --scaffold.'
tags: [cl-repo, skill-setup]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-repo:setup

    Answers known before the run: Claude Code is the only agent used here, and it has the cl-workflow and cl-orchestration plugins installed (this run does not load them). The agent runs on the host with no container (`host`). The stack is Node.js 22 with `node --test`. No bots. Terminal questions are off: put every other question with your recommendation into the plan and stop before Apply.

    The hosted repository is not reachable from this workspace. `.recorded/labels.json` is the output of `gh label list -R tally-org/tally --limit 1000 --json name`, and `.recorded/issue-templates.txt` the owner's issue template lookup. Read them instead of running gh.
  max_turns: 40
  allowed_tools: [Bash]
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: plans-block-in-agents-md
    pattern: 'cedarloom start'
  - type: regex
    name: plans-claude-md
    pattern: 'CLAUDE\.md'
  - type: regex
    name: plans-policy-file
    pattern: 'docs/agents/orchestration\.json'
  - type: regex
    name: plans-label-needs-human
    pattern: 'cl:needs-human'
  - type: regex
    name: plans-label-in-progress
    pattern: 'cl:in-progress'
  - type: regex
    name: plans-label-triage
    pattern: 'cl:triage'
  - type: llm
    name: missing-labels-only
    criteria: 'The plan proposes creating the labels cl:plan, cl:needs-human, cl:in-progress, cl:deferred, cl:follow-up and cl:triage, and does not propose creating cl:ready-for-agent, which already exists.'
  - type: llm
    name: plan-complete
    criteria: 'The plan lists a new committed AGENTS.md holding the CedarLoom block, a CLAUDE.md that is exactly `@AGENTS.md`, a new docs/agents/orchestration.json with `"schemaVersion": 2`, and asks to apply all, a subset or cancel, instead of applying.'
  - type: file_exists
    name: writes-nothing
    path: '**'
    exists: false
  - type: tool_used
    name: creates-no-label
    tool: Bash
    input_match: 'gh label create'
    min: 0
    max: 0
expected_outcome: 'A plan with AGENTS.md (block), CLAUDE.md (`@AGENTS.md`), docs/agents/orchestration.json, docs/agents/worker-rules.md, the issue template and the six missing labels; no file written.'
