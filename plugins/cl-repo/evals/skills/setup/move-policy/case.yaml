schema_version: "1.1"
name: skill-setup-move-policy
description: 'A coordinator policy at docs/agents/orchestration.json: with terminal questions off, setup writes nothing and its plan moves the file to cedarloom.json with $schema and schemaVersion 3, keeping its fields, and proposes no new policy. Needs --scaffold.'
tags: [cl-repo, skill-setup]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-repo:setup

    Answers known before the run: Claude Code is the only agent used here, and it has the cl-workflow and cl-orchestration plugins installed (this run does not load them). The agent runs on the host with no container (`host`). The stack is Node.js 22 with `node --test`. No bots. Terminal questions are off: put every other question with your recommendation into the plan and stop before Apply.

    The hosted repository is not reachable from this workspace. `.recorded/labels.json` is the output of `gh label list -R tally-org/tally --limit 1000 --json name`, and `.recorded/issue-templates.txt` the owner's issue template lookup. Read them instead of running gh.
  max_turns: 40
  allowed_tools: [Bash]
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: plans-the-move
    pattern: 'git mv docs/agents/orchestration\.json cedarloom\.json'
  - type: llm
    name: move-keeps-fields
    criteria: 'The plan moves docs/agents/orchestration.json to cedarloom.json at the repository root, sets "$schema" to https://cedarloom.github.io/cedarloom/schema/cedarloom.json and "schemaVersion" to 3, and keeps startLabel "agent-go" and the merge settings; it neither asks for a new start label nor proposes a second, new policy file.'
  - type: llm
    name: labels-from-moved-file
    criteria: 'The plan proposes creating the label agent-go (the start label of the moved file) and does not propose creating cl:ready-for-agent.'
  - type: file_exists
    name: writes-nothing
    path: '**'
    exists: false
  - type: tool_used
    name: runs-no-git-mv
    tool: Bash
    input_match: 'git mv'
    min: 0
    max: 0
expected_outcome: 'A plan that moves docs/agents/orchestration.json to cedarloom.json with $schema and schemaVersion 3, the fields kept, the label agent-go to create; no file written or moved.'
