schema_version: "1.1"
name: coord-resume-other-session-handoff
description: 'A handoff file that names another session belongs to another coordinator: a new run keeps no handoff file of its own there, leaves that file as it is, names it in the report and picks nothing in a project it names, unless the owner asks to resume that run. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/run-files.md:35. Needs --scaffold.'
tags: [cl-orchestration, coord-resume]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run: run no command and change no file. Decide from these facts, the files named and the skill's text. Orca's executable is `orca`.

    The owner started this session to begin a new run on `project` and did not ask to resume any run. The start condition holds: this is Claude Code, `orca skills get orchestration` succeeded and `orca status --json` printed `appVersion` 1.4.262. Before the run's first write you find `.cedarloom/runs/handoff.md` in this working directory; Read it. The session its `Session:` line names is not this session.

    Write exactly these lines, then stop:
    Existing handoff file: <leave as is | take over with this session's id | delete | overwrite>
    This session's handoff file: <keep one | keep none>
    Pick in project: <yes | no>
    Report: <one line on what the report says about that file>
  max_turns: 10
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: file-left-as-is
    pattern: 'Existing handoff file:\W*leave as is'
    flags: i
  - type: regex
    name: no-own-handoff
    pattern: 'This session''s handoff file:\W*keep none'
    flags: i
  - type: regex
    name: no-pick
    pattern: 'Pick in project:\W*no\b'
    flags: i
  - type: regex
    name: report-names-file
    pattern: 'Report:[^\n]*handoff'
    flags: i
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
expected_outcome: 'Existing handoff file: leave as is; This session''s handoff file: keep none; Pick in project: no (the handoff file names it for another session, SKILL.md:57); Report: names the handoff file of run run-3 and its session.'
