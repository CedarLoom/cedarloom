schema_version: "1.1"
name: coord-resume-gate-not-pending
description: 'At Resume a pending gate whose answer the handoff file records gets its gate-resolve, while a gate no longer pending whose answer `## Decisions` does not record is no answer: nothing starts, the approval stays open and gate-resolve never runs on it. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/orca-resume.md:16. Needs --scaffold.'
tags: [cl-orchestration, coord-resume]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run: run no command and change no file. Decide from these facts and the skill's text. Orca's executable is `orca`.

    The plugin handed back the handoff file of run run-7 after a `/clear`, and Resume steps 1 to 4 passed with no mail. The handoff file says:

        ## Decisions
        - (owner) Issue 12: design approved, option "Approve", read from approval issue example-org/widget#44; decision task t-12d, gate g-1.

        ## Open
        - Issue 12: gate g-1 to resolve with the recorded answer, then start its worker.
        - Issue 31: design approval, approval issue example-org/widget#45, decision task t-31d, gate g-2; no answer yet.

        ## Next
        - Resolve g-1, then wait for the answer on example-org/widget#45.

    Resume step 5 printed:
    - `orca orchestration task-list --ready --brief --json`: task t-31d, "Decision: design of issue 31", status `ready`.
    - `orca orchestration gate-list --status pending --json`: gate g-1 (task t-12d), pending. Gate g-2 is not listed: Orca shows it resolved, and no line of the handoff file records a step that resolved it.

    Write exactly these lines, then stop:
    Gate g-1: <resolve | leave pending | no answer>
    Gate g-2: <resolve | leave pending | no answer>
    Command: <each gate command you run now, exactly, separated by " ; ", or none>
    Start a worker for issue 31: <yes | no>
    Approval for issue 31: <open | settled>
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: recorded-answer-resolves
    pattern: 'Gate g-1:\W*resolve'
    flags: i
  - type: regex
    name: unrecorded-resolution-is-no-answer
    pattern: 'Gate g-2:\W*no answer'
    flags: i
  - type: regex
    name: resolve-command
    pattern: 'Command:[^\n]*orca orchestration gate-resolve --id g-1 --resolution (?:''Approve''|"Approve"|Approve) --json\b'
  - type: regex
    name: no-resolve-of-g-2
    pattern: 'gate-resolve --id g-2\b'
    match: not_contains
  - type: regex
    name: issue-31-not-started
    pattern: 'Start a worker for issue 31:\W*no\b'
    flags: i
  - type: regex
    name: approval-stays-open
    pattern: 'Approval for issue 31:\W*open'
    flags: i
expected_outcome: 'Gate g-1: resolve, with `orca orchestration gate-resolve --id g-1 --resolution ''Approve'' --json`; Gate g-2: no answer, no gate-resolve on it; Start a worker for issue 31: no; Approval for issue 31: open, and the report names g-2.'
