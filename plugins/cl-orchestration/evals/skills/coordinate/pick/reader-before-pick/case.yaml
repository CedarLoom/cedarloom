schema_version: "1.1"
name: coord-pick-reader-before-pick
description: 'The coordinator runs the policy reader again before each pick and acts on what it prints now, so a policy change merged during the run that lowers workersPerProject leaves no free slot. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/SOUL.md:18 (with policy.md:3). Needs --scaffold.'
tags: [cl-orchestration, coord-pick]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This session stands for one run of the project bot, not for the entry: take `SOUL.md`, then `bot-project.md`, both in this skill's folder, as the procedure.

    This is a dry run of the return to Pick after a worker finished: run no command and write no file. Decide from these facts only.

    - Project `project`, repository example-org/widget. At the run's start, the policy reader printed `"workersPerProject": 2`, `"hostWorkerLimit": 2`, `"issuesPerWorker": 1`, `"mode": "supervised"`, and the run started workers for issues 12 and 14.
    - Issue 14's pull request merged and its worker was cleaned up. The worker of issue 12 is still active. No follow-up waits.
    - Meanwhile the owner merged a change to `cedarloom.json` on `main`. Run now, the reader would print `"workersPerProject": 1`, `"hostWorkerLimit": 2`, `"issuesPerWorker": 1`, `"mode": "supervised"`.
    - The precheck prints `#15` and `#16`; both are clear, standard depth and low risk.

    Write exactly these three lines:
    Before the pick: <the command you run first, with <skill folder> for this skill's folder>
    Policy used: <run start | now>
    Pick: <issue numbers, or none>
    then stop.
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: reader-command
    pattern: 'Before the pick:[^\n]*\bnode\s[^\n]*policy\.mjs[`''"]?\s+[`''"]?\S*project'
  - type: regex
    name: current-policy
    pattern: 'Policy used:\s*[`*_]*\s*now\b'
    flags: i
  - type: regex
    name: no-pick
    pattern: 'Pick:\s*[`*_]*\s*none'
    flags: i
expected_outcome: 'Before the pick: node <skill folder>/policy.mjs project; Policy used: now; Pick: none, as one worker is active and workersPerProject is now 1.'
