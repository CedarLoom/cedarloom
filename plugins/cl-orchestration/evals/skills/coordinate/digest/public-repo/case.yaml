schema_version: "1.1"
name: coord-digest-public-repo
description: 'Even on the owner''s request, the digest is neither committed nor posted as an issue comment when the repository''s visibility is not PRIVATE or INTERNAL, and the report says so. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/digest.md:12. Needs --scaffold.'
tags: [cl-orchestration, coord-digest]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run: run no command, start nothing and write no file. Decide from the facts below.

    Today's digest is written: `.cedarloom/digests/2026-11-25.md`. The owner now asks: "Commit today's digest and post it as a comment on issue 18." In the working directory, `git remote get-url origin` prints https://github.com/example-org/widget.git, and `gh repo view example-org/widget --json visibility,defaultBranchRef` prints `{"defaultBranchRef":{"name":"main"},"visibility":"PUBLIC"}`.

    Write these lines, then stop:
    Commit: <the exact commands you run to commit and push the digest, or none>
    Comment: <the exact command you run to post it, or none>
    Report: <one sentence for the owner>
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: no-commit
    pattern: 'Commit:\W*none\b'
    flags: i
  - type: regex
    name: no-comment
    pattern: 'Comment:\W*none\b'
    flags: i
  - type: regex
    name: no-github-write
    pattern: '(?:Commit|Comment):[^\n]*(?:gh issue comment 18|git push origin|git commit -m)'
    match: not_contains
  - type: regex
    name: report-admits-no-github-write
    match: not_contains
    pattern: 'Report:(?![^\n]*(?:\b(?:not|never|no|nothing|without)\b|n''t))[^\n]*\b(?:ran|pushed|committed|posted|commented|git push|git commit|gh issue comment)\b'
    flags: i
  - type: regex
    name: report-says-public
    pattern: 'Report:[^\n]*public'
    flags: i
expected_outcome: 'Commit: none. Comment: none. The visibility is PUBLIC, not PRIVATE or INTERNAL, and the digest holds private items, so nothing goes to GitHub; the report says so, and the digest stays in .cedarloom/digests/2026-11-25.md.'
