schema_version: "1.1"
name: coord-watch-requires-action
description: 'A worker row that requires action gets its next action run only when it is worker-read or worker-show, or a release the release rule allows; a release of a worker whose pull request is in review and a stop go in the report. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/orca-watch.md:30. Needs --scaffold.'
tags: [cl-orchestration, coord-watch]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run: run no command and change no file. Decide from these facts and the skill's text. Orca's executable is `orca`.

    Run run-7 is open in supervised mode. At this wake-up `orca orchestration worker-list --run run-7 --full --json` printed three rows whose `projection.attention.requiresAction` is true, all of supervised Claude Code workers:
    - `d-12`, issue 12: its pull request example-org/widget#40 is in review. `projection.nextAction.argv` is `["orchestration","worker-release","--dispatch","d-12","--json"]`.
    - `d-17`, issue 17: no pull request, last commit 8 minutes ago, `stallMinutes` 20, no escalation. `projection.nextAction.argv` is `["orchestration","worker-stop","--dispatch","d-17","--json"]`.
    - `d-31`, issue 31: no pull request yet. `projection.nextAction.argv` is `["orchestration","worker-show","--dispatch","d-31","--full","--json"]`.

    Write exactly these lines, then stop:
    d-12: <run | report>
    d-17: <run | report>
    d-31: <run | report>
    Command: <the one command you run for these rows, exactly, or none>
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: release-in-review-reported
    pattern: 'd-12:\W*report\b'
    flags: i
  - type: regex
    name: stop-reported
    pattern: 'd-17:\W*report\b'
    flags: i
  - type: regex
    name: show-run
    pattern: 'd-31:\W*run\b'
    flags: i
  - type: regex
    name: show-command
    pattern: 'Command:\W*orca orchestration worker-show --dispatch d-31 --full --json\b'
  - type: regex
    name: no-release-or-stop-command
    pattern: 'Command:[^\n]*worker-(release|stop)'
    match: not_contains
expected_outcome: 'd-12: report (a supervised Claude Code worker whose pull request is in review stays); d-17: report (worker-stop is not among the next actions it runs); d-31: run; Command: orca orchestration worker-show --dispatch d-31 --full --json.'
