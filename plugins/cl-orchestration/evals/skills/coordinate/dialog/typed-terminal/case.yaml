schema_version: "1.1"
name: coord-dialog-typed-terminal
description: 'The owner''s answer to a permission dialog in a worker''s terminal leaves the worker the coordinator''s, while other text a person typed there makes it that person''s, kept with worker-retain and given no follow-up (from CedarLoom/cedarloom#3). Needs --scaffold.'
tags: [cl-orchestration, coord-dialog]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run: run no command and change no file. Decide from these facts and the skill's text. Orca's executable is `orca`.

    Run run-7 is open in supervised mode. Two supervised Claude Code workers sent their `worker_done` reports at this wake-up, and at each report `orca orchestration worker-read --dispatch <id> --json` ran first. The coordinator sent neither worker anything after its start dispatch.
    - `d-12`, issue 12: the output shows the start dispatch, then a permission dialog for `Bash(npm ci)` answered `1. Yes` in its terminal by the owner, then the worker's own work and report.
    - `d-31`, issue 31: the output shows the start dispatch, then this input, which no `send`, dispatch or launch line carried: `> also rename the footer link to Contact while you are at it`, then the worker's work and report. Its pull request example-org/widget#52 has two review findings.

    Write exactly these lines, then stop:
    d-12: <coordinator's | person's>
    d-31: <coordinator's | person's>
    Command: <the one orca command you run now for d-31, exactly, or none>
    Findings of #52 go to: <d-31 as a follow-up | the owner>
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: dialog-answer-keeps-worker
    pattern: 'd-12:\W*coordinator'
    flags: i
  - type: regex
    name: typed-text-makes-it-a-persons
    pattern: 'd-31:\W*person'
    flags: i
  - type: regex
    name: retain-command
    pattern: 'Command:\W*orca orchestration worker-retain --dispatch d-31 --json\b'
  - type: regex
    name: findings-to-owner
    pattern: 'Findings of #52 go to:\W*the owner'
    flags: i
expected_outcome: 'd-12: coordinator''s (the owner''s answer to a dialog leaves the worker the coordinator''s, orca-clean-up.md:12); d-31: person''s; Command: orca orchestration worker-retain --dispatch d-31 --json; Findings of #52 go to: the owner.'
