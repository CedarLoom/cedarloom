schema_version: "1.1"
name: coord-trial-passed
description: 'After a trial merge that passed, the coordinator makes a new scratch clone, says in a pull request comment posted with gh pr comment --body-file that the pull request merges without an update, and goes on with step 4 of Merge, with no branch update. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/trial-merge.md:31. Needs --scaffold.'
tags: [cl-orchestration, coord-trial]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This session stands for one run of the project bot, not for the entry: take `SOUL.md`, then `bot-project.md`, both in this skill's folder, as the procedure.

    This is a dry run of the end of a trial merge for one pull request: run no command and change no file. Decide from the facts below and the files in `project/`, which hold the default branch's commit.

    - Repository example-org/widget, default branch main. Pull request #31 for issue 31, `<head>` 4c1d9e0a7b2f3c4d5e6f708192a3b4c5d6e7f809, which is also the reviewed head. The verdict at step 3 of Merge said `next` trial, with `shared` empty.
    - Steps 1 to 5 of the trial ran: the default-branch commit 9a8b7c6d5e4f30211203f4e5d6c7b8a9f0e1d2c3 is in the handoff file, `git -C <trial path> merge --no-edit 9a8b7c6d5e4f30211203f4e5d6c7b8a9f0e1d2c3` exited 0, the one check command in the trial's dev container exited 0, and that container is removed.
    - The trial's comment text is written to the file `.cedarloom/runs/r-1125/pr-31-trial.md`.

    Write the line `Scratch clone: <new or the same as before the trial>`, then the line `Comment: <the exact gh command that posts the comment>`, then the line `Next: <the number of the step of Merge you go on with>`, then stop.
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: new-scratch-clone
    pattern: 'Scratch clone:\W*(a\s+)?new\b'
    flags: i
  - type: regex
    name: comment-command
    pattern: 'Comment:[^\n]*gh pr comment 31 -R example-org/widget --body-file [''"]?[^\s''"`]*pr-31-trial\.md'
  - type: regex
    name: goes-on-with-step-4
    pattern: 'Next:\W*(step\s+)?4(?![.\d])'
    flags: i
  - type: regex
    name: no-update-or-merge
    pattern: 'gh pr (update-branch|merge) 31'
    match: not_contains
expected_outcome: 'Scratch clone: new; Comment: gh pr comment 31 -R example-org/widget --body-file .cedarloom/runs/r-1125/pr-31-trial.md; Next: 4.'
