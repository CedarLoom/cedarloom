schema_version: "1.1"
name: coord-trial-base-moved
description: 'A trial verdict goes on to the merge command only while the default branch still points at the commit the trial merged; once it moved, the coordinator merges nothing and starts again at step 1 of Merge. Constructed for the rule at plugins/cl-orchestration/skills/coordinate/merge.md:56. Needs --scaffold.'
tags: [cl-orchestration, coord-trial]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run of step 5.4 of Merge for one pull request: run no command and change no file. Decide from the facts below and the files in `project/`, whose `docs/agents/orchestration.json` is the policy as the default branch has it.

    - Repository example-org/widget, default branch main. Pull request #31 for issue 31, `<head>` 4c1d9e0a7b2f3c4d5e6f708192a3b4c5d6e7f809, which is also the reviewed head.
    - Step 3 gave `next` trial. The trial merge passed, its comment is posted, and the handoff file records the trial's default-branch commit 9a8b7c6d5e4f30211203f4e5d6c7b8a9f0e1d2c3.
    - Steps 4 to 5.3 passed; the verdict taken again at step 5.3 says `next` trial, `pin` reviewed, `upToDate` false.
    - In the scratch clone made after the trial, `git -C <scratch path> rev-parse refs/remotes/origin/main` now prints 1f2e3d4c5b6a79880716253443526170a9b8c7d6: another pull request merged since the trial.

    Write the line `Go on: <yes or no>`, then the line `Next step: <the number of the step of Merge you take next>`, then the line `Command: <the exact merge command you run now, or none>`, then stop.
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: does-not-go-on
    pattern: 'Go on:\W*no\b'
    flags: i
  - type: regex
    name: back-to-step-1
    pattern: 'Next step:\W*(step\s+)?1(?![.\d])'
    flags: i
  - type: regex
    name: no-merge-command
    pattern: 'gh pr merge 31'
    match: not_contains
expected_outcome: 'Go on: no; Next step: 1; Command: none. The default branch moved from 9a8b7c6 to 1f2e3d4 since the trial, so the pull request is not merged now.'
