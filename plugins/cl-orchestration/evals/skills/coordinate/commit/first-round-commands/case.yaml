schema_version: "1.1"
name: coord-commit-first-round-commands
description: 'An automatic worker''s first round commits, checks, pushes and opens the draft pull request through one commit-push.mjs commit command, with each reported file and owned path, a title in the coordinator''s own words and a body file in the run folder that carries Closes #<number> when closeIssue is true. Constructed for the rules at plugins/cl-orchestration/skills/coordinate/commit-and-push.md:9 and :12. Needs --scaffold.'
tags: [cl-orchestration, coord-commit]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    /cl-orchestration:coordinate project

    This is a dry run of Commit and push for an automatic worker's first round: run no command and write no file. Decide from these facts only.

    - Project `project` at the absolute path `/srv/evals/project`, repository example-org/widget, default branch `main`. The policy reader prints `"closeIssue": true`. The pull request is not one of an approved pull request list.
    - Issue 12, branch `feat/12-login-timeout`, first round: origin has no such branch and no pull request exists. The spec's owned paths are `src` and `test`.
    - The worker's worktree is `/srv/evals/worktrees/widget-12`; the run folder is `/srv/evals/project/.cedarloom/runs/20261125T101500Z-a1b2c3/`. The skill folder is `/srv/plugins/coordinate`.
    - The worker reported the staged files `src/session.js` and `test/session.test.js` and the commit message `fix: expire idle login sessions`, which you wrote to `/srv/evals/project/.cedarloom/runs/20261125T101500Z-a1b2c3/msg-12.txt`.

    Write exactly these three lines, the command in full:
    Command: <the exact command that commits, pushes and opens the pull request>
    Body file: <the absolute path of the body file you write>
    Body: <the lines of the body file, joined with " | ">
    then stop.
  max_turns: 8
  disallowed_tools: [AskUserQuestion, EnterPlanMode, WebFetch, WebSearch]
graders:
  - type: regex
    name: one-commit-push-command
    pattern: 'Command:(?=[^\n]*\bnode\s+["'']?/srv/plugins/coordinate/commit-push\.mjs["'']?\s+commit\s)(?=[^\n]*--project\s+["'']?/srv/evals/project/?["'']?(?=[\s`]|$))(?=[^\n]*--worktree\s+["'']?/srv/evals/worktrees/widget-12/?["'']?(?=[\s`]|$))(?=[^\n]*--repo\s+example-org/widget(?=[\s`]|$))(?=[^\n]*--branch\s+feat/12-login-timeout(?=[\s`]|$))(?=[^\n]*--default-branch\s+main(?=[\s`]|$))(?=[^\n]*--message\s+["'']?/srv/evals/project/\.cedarloom/runs/20261125T101500Z-a1b2c3/msg-12\.txt)(?=[^\n]*--file\s+["'']?src/session\.js)(?=[^\n]*--file\s+["'']?test/session\.test\.js)(?=[^\n]*--owned\s+["'']?src/?["'']?(?=[\s`]|$))(?=[^\n]*--owned\s+["'']?test/?["'']?(?=[\s`]|$))(?=[^\n]*--title\s+["''`]?[^\s"''`-])(?=[^\n]*--body\s+["'']?/srv/evals/project/\.cedarloom/runs/20261125T101500Z-a1b2c3/[^\s"''`/]+)'
  - type: regex
    name: no-merge-dry-run-or-force
    match: not_contains
    pattern: 'Command:[^\n]*(--merged|--dry-run|--force|\bgit\s+push\b|\bgh\s+pr\s+create\b)'
  - type: regex
    name: body-file-in-run-folder
    pattern: 'Body file:\s*[`"'']?/srv/evals/project/\.cedarloom/runs/20261125T101500Z-a1b2c3/[^\s"''`/]+'
  - type: regex
    name: body-closes-issue
    pattern: 'Body:[^\n]*fix: expire idle login sessions[^\n]*Closes #12\b'
expected_outcome: 'Command: node /srv/plugins/coordinate/commit-push.mjs commit --project /srv/evals/project --worktree /srv/evals/worktrees/widget-12 --repo example-org/widget --branch feat/12-login-timeout --default-branch main --message <run folder>/msg-12.txt --file src/session.js --file test/session.test.js --owned src --owned test --title "<own words>" --body <run folder>/<body file>; the body file is in the run folder and holds the commit message and Closes #12.'
