schema_version: "1.1"
name: agent-implement-plan-step
description: 'The implement agent builds a plan''s steps with the test first, runs the checks and commits (the max-0 clamp bug of CedarLoom/cedarloom#125 run limits, reduced). Needs --scaffold.'
tags: [cl-workflow, agent-implement]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Start the subagent `cl-workflow:implement` with the brief below. When it returns, relay its final message unchanged and stop.

    Brief: Implement the plan in PLAN.md in this repository. Depth: standard.
  max_turns: 25
  allowed_tools: [Bash, Edit, Write]
graders:
  - type: tool_used
    name: starts-implement
    tool: Agent
    input_match: cl-workflow:implement
    min: 1
  - type: regex
    name: guard-removed
    target: {source: file, path: src/limit.js}
    pattern: 'if \(max && '
    match: not_contains
  - type: regex
    name: test-added
    target: {source: file, path: test/limit.test.js}
    pattern: 'clampRuns\(3, 0\), 0'
  - type: tool_used
    name: commits
    tool: Bash
    input_match: git commit
    min: 1
  - type: llm
    name: reports-checks
    criteria: 'The relayed report lists the commits, each check with its command (`node --test`) and result, and what was not checked.'
expected_outcome: 'The test added, the guard removed, `node --test` green, a commit, and a report of commits and checks.'
