schema_version: "1.1"
name: skill-lite-bug-leaves-lite
description: 'A bug hits the lite gate even when the fix looks like one line (from OpenReloading/Ballistics#1301).'
tags: [cl-workflow, skill-lite]
execution:
  prompt: |
    /cl-workflow:lite Fix the leave guard that takes the app's own Back button for the user's and asks to discard changes on in-app navigation.

    This run checks the classification only: write the lines the workflow asks for before the first edit or command, then stop. Edit no file and run no command.
  max_turns: 6
graders:
  - type: tool_used
    name: hands-over-to-workflow
    tool: Skill
    input_match: cl-workflow:workflow
    min: 1
  - type: regex
    name: not-lite-quick
    pattern: 'Depth: quick \(lite'
    match: not_contains
  - type: regex
    name: depth-standard-or-deep
    pattern: 'Depth: (standard|deep)'
expected_outcome: 'Lite names the bug gate, loads cl-workflow:workflow and writes `Depth: standard (bug ...)` or deeper.'
