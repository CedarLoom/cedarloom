schema_version: "1.1"
name: skill-dev-chart-bug-standard
description: 'A UI bug runs as a software change of at least standard depth (from OpenReloading/Ballistics#1304).'
tags: [cl-workflow, skill-dev]
execution:
  prompt: |
    /cl-workflow:dev The burn rate chart loses its tooltip when the run's band data arrives after the first render. Keep the tooltip.

    This run checks the classification only: write the lines the workflow asks for before the first edit or command, then stop. Edit no file and run no command.
  max_turns: 6
graders:
  - type: tool_used
    name: loads-workflow-skill
    tool: Skill
    input_match: cl-workflow:workflow
    min: 1
  - type: regex
    name: depth-standard-or-deep
    pattern: 'Depth: (standard|deep)'
  - type: regex
    name: risk-line
    pattern: 'Risk: (low|medium|high)'
expected_outcome: '`Depth: standard (bug ...)` or deeper and a `Risk:` line.'
