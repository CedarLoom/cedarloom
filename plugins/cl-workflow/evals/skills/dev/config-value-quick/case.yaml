schema_version: "1.1"
name: skill-dev-config-value-quick
description: '/cl-workflow:dev hands a one-value config change to the workflow skill as a software change at quick depth (from CedarLoom/cedarloom#119).'
tags: [cl-workflow, skill-dev]
execution:
  prompt: |
    /cl-workflow:dev Raise the token budget total in .github/token-budget.json from 120,000 to 123,000.

    This run checks the classification only: write the lines the workflow asks for before the first edit or command, then stop. Edit no file and run no command.
  max_turns: 6
graders:
  - type: tool_used
    name: loads-workflow-skill
    tool: Skill
    input_match: cl-workflow:workflow
    min: 1
  - type: regex
    name: depth-quick
    pattern: 'Depth: quick'
  - type: regex
    name: risk-line
    pattern: 'Risk: low'
  - type: tool_used
    name: edits-nothing
    tool: Edit
    max: 0
expected_outcome: '`Depth: quick (...)` and `Risk: low (...)` after loading cl-workflow:workflow.'
